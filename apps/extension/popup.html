<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <style>
    body {
      width: 320px;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      padding: 16px;
      color: #333;
    }
    h2 {
      margin-top: 0;
      font-size: 18px;
    }
    label {
      display: block;
      font-size: 12px;
      font-weight: 600;
      margin-bottom: 4px;
      color: #555;
    }
    input {
      width: 100%;
      padding: 8px;
      box-sizing: border-box;
      border: 1px solid #ccc;
      border-radius: 4px;
      margin-bottom: 12px;
    }
    button {
      width: 100%;
      padding: 10px;
      background-color: #4f46e5;
      color: white;
      border: none;
      border-radius: 4px;
      cursor: pointer;
      font-weight: bold;
    }
    button:hover {
      background-color: #4338ca;
    }
    #status {
      margin-top: 12px;
      font-size: 12px;
      color: #10b981;
      text-align: center;
      display: none;
    }
  </style>
</head>
<body>
  <h2>LeetCode Tracker Settings</h2>
  <p style="font-size: 13px; color: #666; margin-bottom: 16px;">
    To link this extension to your tracker, log into your local dashboard, open the browser developer tools (F12) -> Application -> Local Storage, and copy the 'token' value here.
  </p>
  
  <div>
    <label>JWT Token</label>
    <input type="password" id="jwtToken" placeholder="eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9...">
  </div>
  
  <button id="saveBtn">Save Token</button>
  <div id="status">Token saved successfully!</div>

  <script src="popup.js"></script>
</body>
</html>
